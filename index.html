<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Scent Club - Decants de Perfumes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>The Scent Club | Pesqueira</h1>
    <p>Decants de Perfumería Árabe</p>
  </header>

  <main class="contenedor-principal">
    <!-- Sección de Productos -->
    <section class="catalogo">
      <h2>Catálogo de Decants</h2>
      <div id="grid-productos" class="grid-productos"></div>
    </section>

    <!-- Sección del Carrito -->
    <aside class="carrito-container">
      <h2>Tu Pedido</h2>
      <div id="items-carrito">
        <p class="carrito-vacio">El carrito está vacío</p>
      </div>
      <div class="resumen-carrito">
        <h3>Total: $<span id="total-precio">0</span> MXN</h3>
        <button id="btn-whatsapp" onclick="enviarPedidoWhatsApp()" disabled>
          Pedir por WhatsApp
        </button>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
  <!-- Notificación flotante (Toast) -->
<div id="notificacion" class="notificacion-toast">¡Producto agregado al carrito!</div>

<!-- Botón flotante para ver el carrito en móvil -->
<button id="btn-carrito-flotante" onclick="irAlCarrito()">
  🛒 (<span id="contador-flotante">0</span>)
</button>
</body>
</html>
